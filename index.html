    <!--
      Предзагрузка картинки первого экрана: самый крупный элемент страницы.
      Ссылка одна и подбирается под ширину экрана скриптом, а не двумя
      <link media="…">: Firefox пишет предупреждение про каждую предзагрузку
      с неподходящим media. Файлы те же, что в <picture> первого экрана:
      мобильный до 1023 px, горизонтальные 1280/1920 от 1024 px.
      Скрипт синхронный в <head>, запрос уходит до загрузки бандла.
    -->
    <script>
      (function () {
        var link = document.createElement('link')
        link.rel = 'preload'
        link.as = 'image'
        link.setAttribute('fetchpriority', 'high')
        if (window.matchMedia('(min-width: 1024px)').matches) {
          link.setAttribute(
            'imagesrcset',
            '%BASE_URL%photos/hero-autumn-1280.webp 1280w, %BASE_URL%photos/hero-autumn-1920.webp 1920w'
          )
          link.setAttribute('imagesizes', '100vw')
        } else {
          link.href = '%BASE_URL%photos/hero-autumn-mobile-1080.webp'
        }
        document.head.appendChild(link)
      })()
    </script>
