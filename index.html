<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A1512" />
    <title>Бани Вятки — мобильная баня «Подкова»</title>
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <!--
      Предзагрузка картинки первого экрана: самый крупный элемент страницы.
      Ссылка одна и подбирается под ширину экрана скриптом, а не двумя
      <link media="…">: Firefox пишет предупреждение про каждую предзагрузку
      с неподходящим media. Файлы те же, что в <picture> первого экрана:
      мобильный до 1023 px, горизонтальные 1280/1920 от 1024 px.
      Скрипт синхронный в <head>, запрос уходит до загрузки бандла.
    -->
    <script>
      (function () {
        var link = document.createElement('link')
        link.rel = 'preload'
        link.as = 'image'
        link.setAttribute('fetchpriority', 'high')
        if (window.matchMedia('(min-width: 1024px)').matches) {
          link.setAttribute(
            'imagesrcset',
            '%BASE_URL%photos/hero-autumn-1280.webp 1280w, %BASE_URL%photos/hero-autumn-1920.webp 1920w'
          )
          link.setAttribute('imagesizes', '100vw')
        } else {
          link.href = '%BASE_URL%photos/hero-autumn-mobile-1080.webp'
        }
        document.head.appendChild(link)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
