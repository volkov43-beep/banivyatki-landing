name: Build and deploy site to REG.RU

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_only:
        description: "Read-only preflight on enabled targets"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'banivyatki-reg-ru-deploy' || format('banivyatki-reg-ru-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring
          coverage: none
      - run: |
          python3 -m unittest discover -s scripts/deploy -p 'test_*.py'
          php server/tests/phone.test.php
          php server/tests/handler.test.php

  build:
    needs: regression
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, mbstring
          coverage: none
      - run: npm ci
      - name: Install isolated test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/bv-tests" --no-save --package-lock=false jsdom@26.1.0 playwright-core@1.56.1
          node "$RUNNER_TEMP/bv-tests/node_modules/playwright-core/cli.js" install --with-deps chromium
          echo "BV_PLAYWRIGHT_PATH=$RUNNER_TEMP/bv-tests/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
          echo "BV_JSDOM_PATH=$RUNNER_TEMP/bv-tests/node_modules/jsdom/lib/api.js" >> "$GITHUB_ENV"
      - name: Build production site with Yandex Maps key
        env:
          VITE_YMAPS_KEY: ${{ secrets.VITE_YMAPS_KEY }}
        run: |
          if [ -z "$VITE_YMAPS_KEY" ]; then
            echo "VITE_YMAPS_KEY is missing: refusing to build without the configured maps key" >&2
            exit 1
          fi
          npm run build
      - name: Test both apex sites and www redirects with Apache
        run: |
          if [[ ! -x /usr/sbin/apache2 ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y apache2-bin
          fi
          bash scripts/deploy/check_apache.sh
      - name: Test landings, forms and both domain identities
        run: |
          node scripts/tests/cta.dom.mjs
          node scripts/tests/quiz.dom.mjs
          node scripts/tests/faq.dom.mjs
          node scripts/tests/cta.browser.mjs
          node scripts/tests/visits.browser.mjs
          node scripts/tests/locations.browser.mjs
          node scripts/tests/prices.browser.mjs
          node scripts/tests/release.browser.mjs
          php server/tests/phone.test.php
          php server/tests/handler.test.php
          php server/tests/handler.test.php --browser
      - name: Validate public files only
        run: |
          test -f dist/index.html
          test -f dist/syktyvkar/index.html
          test -f dist/privacy/index.html
          test -f dist/api/lead.php
          test -f dist/.htaccess
          test -f dist/robots.txt
          test ! -e dist/private
          test ! -e dist/config.php
          node scripts/tests/public-build.mjs
          if grep -rq "banivyatki-landing" dist; then
            echo "Unexpected legacy base path in dist" >&2
            exit 1
          fi
      - name: Keep downloadable backup artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_attempt == 1 && 'banivyatki-reg-ru-site' || format('banivyatki-reg-ru-site-{0}', github.run_attempt) }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: REG.RU · ${{ matrix.domain }}
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: banivyatki.ru
            prefix: REG
          - domain: bani-vyatki.ru
            prefix: REG_NEW
    env:
      DOMAIN: ${{ matrix.domain }}
      SITE_DIR: ${{ vars[format('{0}_FTP_DIR', matrix.prefix)] }}
    steps:
      - name: Select permitted mode
        id: plan
        env:
          CONFIGURED: ${{ vars[format('{0}_DEPLOY_MODE', matrix.prefix)] }}
          PREVIEW_ONLY: ${{ inputs.preview_only }}
          AUDIT_BRANCH: ${{ github.event.pull_request.number == 59 && github.head_ref == 'deploy/bani-vyatki-reg-ru-20261120' }}
        run: |
          mode="${CONFIGURED:-off}"
          case "$mode" in off|dry-run|live) ;; *) echo 'Unknown deployment mode'; exit 1 ;; esac
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            if [[ "$mode" == live && "$AUDIT_BRANCH" != true ]]; then mode=off; fi
            if [[ "$mode" != off ]]; then mode=dry-run; fi
          elif [[ "$GITHUB_REF" != refs/heads/main || "$PREVIEW_ONLY" == true ]]; then
            if [[ "$mode" != off ]]; then mode=dry-run; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_MODE=$mode" >> "$GITHUB_ENV"
      - name: List missing secondary settings without exposing values
        if: matrix.prefix == 'REG_NEW' && steps.plan.outputs.mode == 'off'
        env:
          HOST_SET: ${{ secrets.REG_NEW_FTP_SERVER != '' }}
          LOGIN_SET: ${{ secrets.REG_NEW_FTP_USERNAME != '' }}
          PASSWORD_SET: ${{ secrets.REG_NEW_FTP_PASSWORD != '' }}
          DIR_SET: ${{ vars.REG_NEW_FTP_DIR != '' }}
        run: |
          [[ "$HOST_SET" == true ]] || echo "Missing REG_NEW_FTP_SERVER"
          [[ "$LOGIN_SET" == true ]] || echo "Missing REG_NEW_FTP_USERNAME"
          [[ "$PASSWORD_SET" == true ]] || echo "Missing REG_NEW_FTP_PASSWORD"
          [[ "$DIR_SET" == true ]] || echo "Missing REG_NEW_FTP_DIR"
      - uses: actions/checkout@v4
        if: steps.plan.outputs.mode != 'off'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: steps.plan.outputs.mode != 'off'
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          merge-multiple: true
          path: dist/
      - name: Read-only FTPS preview
        if: steps.plan.outputs.mode == 'dry-run'
        env:
          FTP_HOST: ${{ secrets[format('{0}_FTP_SERVER', matrix.prefix)] }}
          FTP_USER: ${{ secrets[format('{0}_FTP_USERNAME', matrix.prefix)] }}
          FTP_PASS: ${{ secrets[format('{0}_FTP_PASSWORD', matrix.prefix)] }}
        run: python3 scripts/deploy/reg_ru.py preview "$DOMAIN"
      - name: Verify main and update only recognized private PHP
        if: steps.plan.outputs.mode == 'live' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          FTP_HOST: ${{ secrets[format('{0}_FTP_SERVER', matrix.prefix)] }}
          FTP_USER: ${{ secrets[format('{0}_FTP_USERNAME', matrix.prefix)] }}
          FTP_PASS: ${{ secrets[format('{0}_FTP_PASSWORD', matrix.prefix)] }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "This release is stale. Run the workflow for the current main."
            exit 1
          fi
          python3 scripts/deploy/reg_ru.py prepare "$DOMAIN"
      - name: Publish the verified public artifact
        if: steps.plan.outputs.mode == 'live' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets[format('{0}_FTP_SERVER', matrix.prefix)] }}
          username: ${{ secrets[format('{0}_FTP_USERNAME', matrix.prefix)] }}
          password: ${{ secrets[format('{0}_FTP_PASSWORD', matrix.prefix)] }}
          server-dir: ${{ env.SITE_DIR }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./dist/
          dangerous-clean-slate: false
          log-level: minimal
      - name: Verify public HTTPS release and executed PHP
        if: steps.plan.outputs.mode == 'live'
        env:
          FTP_HOST: ${{ secrets[format('{0}_FTP_SERVER', matrix.prefix)] }}
          FTP_USER: ${{ secrets[format('{0}_FTP_USERNAME', matrix.prefix)] }}
          FTP_PASS: ${{ secrets[format('{0}_FTP_PASSWORD', matrix.prefix)] }}
        run: python3 scripts/deploy/reg_ru.py verify "$DOMAIN"
      - name: Record result
        if: always()
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          RESULT: ${{ job.status }}
          ARTIFACT: ${{ needs.build.outputs.artifact }}
        run: |
          echo "### $DOMAIN" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode \`${MODE:-invalid}\` · result \`$RESULT\` · commit \`$GITHUB_SHA\` · artifact \`$ARTIFACT\`." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$MODE" != live ]]; then echo "No production upload." >> "$GITHUB_STEP_SUMMARY"; fi
