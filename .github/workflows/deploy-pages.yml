# Сборка и публикация лендинга на GitHub Pages.
# Источник Pages в настройках репозитория должен быть «GitHub Actions»;
# шаг configure-pages с enablement: true пытается включить его сам.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      # Проектный сайт живёт по адресу <owner>.github.io/<repo>/,
      # поэтому базовый путь берём из имени репозитория.
      # Ключ Яндекс Карт — из секрета репозитория (Settings → Secrets and variables →
      # Actions). Без него сайт собирается, блок карты показывает только список мест.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          VITE_YMAPS_KEY: ${{ secrets.VITE_YMAPS_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
